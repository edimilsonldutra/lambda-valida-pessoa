name: 🚀 CD - Deploy to Production

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deploys to production
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.6.0'

jobs:
  # Job 1: Validação Prévia
  pre-deployment-checks:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      - name: 🧪 Run All Tests
        working-directory: ./LambdaValidaPessoa
        run: mvn clean verify -B

      - name: 📊 Check Test Coverage
        working-directory: ./LambdaValidaPessoa
        run: |
          mvn jacoco:report jacoco:check -B
        continue-on-error: true

      - name: 🔒 Security Scan
        working-directory: ./LambdaValidaPessoa
        run: mvn org.owasp:dependency-check-maven:check -B
        continue-on-error: true

  # Job 2: Aprovação Manual para Produção
  approval:
    name: 👥 Manual Approval Required
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: production-approval

    steps:
      - name: ✅ Approval Granted
        run: echo "Deployment to production approved by ${{ github.actor }}"

  # Job 3: Build e Deploy
  build-and-deploy:
    name: 🏗️ Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: approval
    # Expor outputs que outros jobs consomem (new_version, api_url)
    outputs:
      new_version: ${{ steps.deploy.outputs.new_version }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      backup_version: ${{ steps.backup.outputs.backup_version }}
    environment:
      name: production
      # note: environment.url can't reliably reference steps before they run in all contexts
      # será preenchido via job output e usado por jobs que precisem: needs.build-and-deploy.outputs.api_url
      url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      - name: 🔧 Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: 🔧 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📦 Build Package
        working-directory: ./LambdaValidaPessoa
        run: mvn clean package -DskipTests -B

      - name: 💾 Backup Current Version
        id: backup
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          
          # Tenta obter a versão atual apontada pela alias 'production' (se existir)
          BACKUP_VERSION=$(aws lambda get-alias --function-name ${FUNCTION_NAME} --name production --query 'FunctionVersion' --output text 2>/dev/null || true)

          # Se não existir alias 'production', tenta obter a última versão publicada (não $LATEST)
          if [ -z "${BACKUP_VERSION}" ] || [ "${BACKUP_VERSION}" = "None" ]; then
            BACKUP_VERSION=$(aws lambda list-versions-by-function --function-name ${FUNCTION_NAME} --query 'Versions[?Version!="\$LATEST"][-1].Version' --output text 2>/dev/null || true)
          fi

          # Se ainda não houver versão publicada (p.ex. função nova), publica uma versão para servir de backup
          if [ -z "${BACKUP_VERSION}" ] || [ "${BACKUP_VERSION}" = "None" ]; then
            echo "No published version found - publishing a version to serve as backup"
            PUBLISHED=$(aws lambda publish-version --function-name ${FUNCTION_NAME} --description "backup-$(date +%Y%m%d-%H%M%S)" --query 'Version' --output text || true)
            BACKUP_VERSION=${PUBLISHED}
          fi

          # Cria alias de backup apontando para a versão encontrada (se houver)
          if [ -n "${BACKUP_VERSION}" ] && [ "${BACKUP_VERSION}" != "None" ]; then
            aws lambda create-alias \
              --function-name ${FUNCTION_NAME} \
              --name "backup-$(date +%Y%m%d-%H%M%S)" \
              --function-version ${BACKUP_VERSION} \
              || true
          fi

          echo "backup_version=${BACKUP_VERSION}" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Production (Blue/Green)
        id: deploy
        working-directory: ./LambdaValidaPessoa
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          S3_BUCKET="${{ secrets.S3_DEPLOYMENT_BUCKET_PROD }}"
          S3_KEY="lambda-valida-pessoa/prod/lambda-${GITHUB_SHA::8}.jar"
          
          # Upload para S3 com retry
          echo "📦 Uploading JAR to S3..."
          for i in {1..3}; do
            if aws s3 cp target/ValidaPessoa-1.0.jar s3://${S3_BUCKET}/${S3_KEY}; then
              echo "✅ JAR uploaded to S3"
              break
            else
              echo "⚠️ Upload failed, retrying ($i/3)..."
              sleep 5
            fi
          done
          
          # Atualiza código da função e publica nova versão
          echo "🔄 Updating Lambda function code..."
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name ${FUNCTION_NAME} \
            --s3-bucket ${S3_BUCKET} \
            --s3-key ${S3_KEY} \
            --publish \
            --query 'Version' \
            --output text)
          
          echo "New version published: ${NEW_VERSION}"
          
          # Aguarda atualização
          echo "⏳ Waiting for function update to complete..."
          aws lambda wait function-updated --function-name ${FUNCTION_NAME}
          
          # Estratégia Blue/Green: atualiza alias gradualmente
          # Primeiro: 10% do tráfego para nova versão (CANARY)
          echo "🚦 Starting canary deployment (10% traffic)..."
          
          # Get current version from production alias
          CURRENT_VERSION=$(aws lambda get-alias \
            --function-name ${FUNCTION_NAME} \
            --name production \
            --query 'FunctionVersion' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "${CURRENT_VERSION}" ] && [ "${CURRENT_VERSION}" != "None" ]; then
            # Update alias with weighted routing - FIXED JSON SYNTAX
            aws lambda update-alias \
              --function-name ${FUNCTION_NAME} \
              --name production \
              --function-version ${CURRENT_VERSION} \
              --routing-config "{\"AdditionalVersionWeights\":{\"${NEW_VERSION}\":0.1}}"
          else
            # Create alias if doesn't exist
            aws lambda create-alias \
              --function-name ${FUNCTION_NAME} \
              --name production \
              --function-version ${NEW_VERSION} \
              --description "Production alias"
          fi
          
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          
          # Obtém URL do API
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Tags.Environment=='production' && Tags.Project=='valida-pessoa'].ApiId | [0]" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "${API_ID}" ] || [ "${API_ID}" == "None" ]; then
            # Fallback to name-based query
            API_ID=$(aws apigatewayv2 get-apis \
              --query "Items[?Name=='lambda-valida-pessoa-prod'].ApiId | [0]" \
              --output text)
          fi
          
          API_URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod"
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "✅ Canary deployment initiated"

      - name: ⏸️ Wait and Monitor (Canary Phase)
        run: |
          echo "🕒 Monitoring canary deployment (10% traffic) for 5 minutes..."
          sleep 300

      - name: 📊 Check Canary Metrics
        id: canary_check
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          
          # Compatible date command for both GNU and BSD date
          START_TIME=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-5M +%Y-%m-%dT%H:%M:%S)
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%S)
          
          echo "Checking metrics from ${START_TIME} to ${END_TIME}"
          
          # Verifica erros nos últimos 5 minutos
          ERROR_COUNT=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=${FUNCTION_NAME} \
            --start-time ${START_TIME} \
            --end-time ${END_TIME} \
            --period 300 \
            --statistics Sum \
            --query 'Datapoints[0].Sum' \
            --output text 2>/dev/null || echo "0")
          
          # Verifica throttles
          THROTTLE_COUNT=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Throttles \
            --dimensions Name=FunctionName,Value=${FUNCTION_NAME} \
            --start-time ${START_TIME} \
            --end-time ${END_TIME} \
            --period 300 \
            --statistics Sum \
            --query 'Datapoints[0].Sum' \
            --output text 2>/dev/null || echo "0")
          
          echo "📊 Metrics Summary:"
          echo "  Errors: ${ERROR_COUNT}"
          echo "  Throttles: ${THROTTLE_COUNT}"
          
          # Converte None para 0
          [ "${ERROR_COUNT}" = "None" ] && ERROR_COUNT=0
          [ "${THROTTLE_COUNT}" = "None" ] && THROTTLE_COUNT=0
          
          # Avalia saúde do canary
          if [ "${ERROR_COUNT}" -gt 5 ] || [ "${THROTTLE_COUNT}" -gt 2 ]; then
            echo "canary_success=false" >> $GITHUB_OUTPUT
            echo "❌ Too many errors or throttles detected during canary phase"
            echo "   Errors: ${ERROR_COUNT} (threshold: 5)"
            echo "   Throttles: ${THROTTLE_COUNT} (threshold: 2)"
            exit 1
          else
            echo "canary_success=true" >> $GITHUB_OUTPUT
            echo "✅ Canary phase successful - metrics within acceptable range"
          fi
            exit 1
          else
            echo "canary_success=true" >> $GITHUB_OUTPUT
            echo "✅ Canary phase successful"
          fi

      - name: 🚀 Full Deployment (100% Traffic)
        if: steps.canary_check.outputs.canary_success == 'true'
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          NEW_VERSION="${{ steps.deploy.outputs.new_version }}"
          
          # Move 100% do tráfego para nova versão
          aws lambda update-alias \
            --function-name ${FUNCTION_NAME} \
            --name production \
            --function-version ${NEW_VERSION}
          
          echo "✅ Full deployment completed - 100% traffic to version ${NEW_VERSION}"

      - name: 🔄 Rollback on Failure
        if: failure() && steps.deploy.outputs.new_version != ''
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          BACKUP_VERSION="${{ steps.backup.outputs.backup_version }}"
          NEW_VERSION="${{ steps.deploy.outputs.new_version }}"
          
          echo "❌ Deployment failed - Initiating rollback"
          echo "   Rolling back to version: ${BACKUP_VERSION}"
          echo "   Failed version: ${NEW_VERSION}"
          
          # Rollback: move 100% traffic back to backup version
          if [ -n "${BACKUP_VERSION}" ] && [ "${BACKUP_VERSION}" != "None" ]; then
            aws lambda update-alias \
              --function-name ${FUNCTION_NAME} \
              --name production \
              --function-version ${BACKUP_VERSION} \
              --routing-config '{}' || echo "Failed to update alias"
            
            echo "✅ Rollback completed - all traffic restored to version ${BACKUP_VERSION}"
          else
            echo "⚠️ No backup version available - manual intervention required"
          fi
          
          # Tag failed version for investigation
          aws lambda update-function-configuration \
            --function-name ${FUNCTION_NAME}:${NEW_VERSION} \
            --description "FAILED DEPLOYMENT - DO NOT USE - $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            2>/dev/null || echo "Could not tag failed version"
          
          # Send alert
          echo "::error::Production deployment failed and was rolled back to version ${BACKUP_VERSION}"

  # Job 4: Deploy da Infraestrutura
  deploy-infrastructure:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-deploy
    environment:
      name: production-infra

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔧 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Terraform Init
        working-directory: ./infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=lambda-valida-pessoa/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE || 'terraform-state-lock' }}"

      - name: 📋 Terraform Plan
        working-directory: ./infra/terraform
        run: |
          terraform plan \
            -var="environment=production" \
            -var="aws_region=${AWS_REGION}" \
            -out=tfplan

      - name: 🚀 Terraform Apply
        working-directory: ./infra/terraform
        run: terraform apply -auto-approve tfplan

  # Job 5: Testes de Produção
  production-tests:
    name: 🧪 Production Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🧪 Health Check
        run: |
          API_URL="${{ needs.build-and-deploy.outputs.api_url }}"
          
          # Testa endpoint de health
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${API_URL}/health)
          
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Health check failed with status: $RESPONSE"
            exit 1
          fi
          
          echo "✅ Health check passed"

      - name: 🧪 Smoke Tests
        run: |
          FUNCTION_NAME="lambda-valida-pessoa-prod"
          
          # Testa com evento válido
          aws lambda invoke \
            --function-name ${FUNCTION_NAME}:production \
            --payload file://events/event.json \
            --cli-binary-format raw-in-base64-out \
            response.json
          
          cat response.json
          
          if grep -q "errorMessage" response.json; then
            echo "❌ Smoke test failed"
            exit 1
          fi
          
          echo "✅ Smoke tests passed"

  # Job 6: Criar Release Tag
  create-release:
    name: 🏷️ Create Release Tag
    runs-on: ubuntu-latest
    needs: [build-and-deploy, production-tests]
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Gera versão semântica
          VERSION=$(date +v%Y.%m.%d)-${GITHUB_SHA::8}
          
          git tag -a $VERSION -m "Production release $VERSION"
          git push origin $VERSION
          
          echo "Created release tag: $VERSION"

  # Job 7: Notificação
  notify:
    name: 📢 Notify Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-and-deploy, production-tests, deploy-infrastructure]
    if: always()

    steps:
      - name: 📢 Slack Notification
        uses: slackapi/slack-github-action@v1
        if: secrets.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "text": "🚀 Production Deployment ${{ needs.build-and-deploy.result == 'success' && 'Successful' || 'Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.build-and-deploy.result == 'success' && '✅' || '❌' }} Production Deployment"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nProduction"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.build-and-deploy.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ needs.build-and-deploy.outputs.new_version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployed By:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: 📧 Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Production Deployment Failed - ${{ github.repository }}"
          body: |
            Production deployment failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: GitHub Actions
        continue-on-error: true
