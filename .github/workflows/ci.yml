name: 🔍 Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'test/**'

# Prevent concurrent workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  # Job 1: Validação de código e qualidade
  code-quality:
    name: 📊 Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      - name: 🔧 Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: 🔍 Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 🧹 Run Maven Checkstyle
        working-directory: ./LambdaValidaPessoa
        run: mvn checkstyle:check -B
        continue-on-error: true

      - name: 🔒 OWASP Dependency Check
        working-directory: ./LambdaValidaPessoa
        run: mvn org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: 📊 SonarCloud Scan
        if: github.event_name == 'pull_request'
        working-directory: ./LambdaValidaPessoa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=lambda-valida-pessoa \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io
        continue-on-error: true

  # Job 2: Build e Testes Unitários
  build-and-test:
    name: 🏗️ Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      - name: 🔧 Maven Cache
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🏗️ Build with Maven
        working-directory: ./LambdaValidaPessoa
        run: mvn clean compile -B

      - name: 🧪 Run Unit Tests
        working-directory: ./LambdaValidaPessoa
        run: mvn test -B

      - name: 📊 Generate Test Coverage Report
        working-directory: ./LambdaValidaPessoa
        run: mvn jacoco:report -B

      - name: 📈 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./LambdaValidaPessoa/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📦 Package Application
        working-directory: ./LambdaValidaPessoa
        run: mvn package -DskipTests -B

      - name: 💾 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-${{ github.sha }}
          path: LambdaValidaPessoa/target/*.jar
          retention-days: 7

  # Job 3: Testes de Integração
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    services:
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: dynamodb,lambda,apigateway
          DEBUG: 1
        ports:
          - 4566:4566

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      - name: 🔧 Configure AWS CLI for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set region us-east-1

      - name: 🧪 Run Integration Tests
        working-directory: ./LambdaValidaPessoa
        env:
          AWS_ENDPOINT: http://localhost:4566
        run: mvn verify -Pintegration-tests -B || echo "::warning::Integration tests failed - please fix before merging"

  # Job 4: Validação do Docker Build
  docker-build:
    name: 🐳 Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true  # ✅ CRUCIAL: Carrega a imagem no Docker local
          tags: lambda-valida-pessoa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lambda-valida-pessoa:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: 📤 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Job 5: Validação do Terraform
  terraform-validate:
    name: 🏗️ Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: 🎨 Terraform Format Check
        working-directory: ./infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: 🔍 Terraform Init
        working-directory: ./infra/terraform
        run: terraform init -backend=false

      - name: ✅ Terraform Validate
        working-directory: ./infra/terraform
        run: terraform validate

      - name: 📊 Run TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: 🔍 TFLint
        working-directory: ./infra/terraform
        run: |
          tflint --init
          tflint
        continue-on-error: true

  # Job 6: Status Check Final
  ci-success:
    name: ✅ CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test, integration-tests, docker-build, terraform-validate]
    timeout-minutes: 5
    if: always()

    steps:
      - name: ✅ Check CI Status
        run: |
          echo "=== CI Pipeline Status ==="
          echo "Build and Test: ${{ needs.build-and-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Terraform Validate: ${{ needs.terraform-validate.result }}"
          echo ""
          
          # Check critical jobs
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "❌ Build and tests failed"
            exit 1
          fi
          if [[ "${{ needs.terraform-validate.result }}" != "success" ]]; then
            echo "❌ Terraform validation failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          
          # Warn on non-critical jobs but don't fail
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "⚠️ Code quality checks failed - please review"
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "⚠️ Integration tests failed - please review"
          fi
          
          echo ""
          echo "✅ All critical CI checks passed!"

