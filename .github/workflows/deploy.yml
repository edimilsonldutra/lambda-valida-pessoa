name: Deploy Lambda Valida Pessoa

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - staging
          - production

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0
  JAVA_VERSION: '21'

jobs:
  # ============================================================================
  # Job 1: Build and Test
  # ============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd LambdaValidaPessoa
          mvn clean package -DskipTests -B

      - name: Run tests
        run: |
          cd LambdaValidaPessoa
          mvn test -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: LambdaValidaPessoa/target/*.jar
          retention-days: 5

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: LambdaValidaPessoa/target/surefire-reports/*.xml
          reporter: java-junit

  # ============================================================================
  # Job 2: Security Scan
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './LambdaValidaPessoa'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Job 3: Terraform Validate and Plan
  # ============================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: LambdaValidaPessoa/target/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars
        run: |
          cd infra/terraform
          cat > terraform.tfvars <<EOF
          aws_region  = "${{ env.AWS_REGION }}"
          environment = "${{ github.event.inputs.environment || 'dev' }}"
          project_name = "valida-pessoa"
          
          jwt_secret        = "${{ secrets.JWT_SECRET }}"
          jwt_expiration_ms = 3600000
          
          lambda_timeout     = 30
          lambda_memory_size = 512
          lambda_jar_path    = "../../LambdaValidaPessoa/target/ValidaPessoa-1.0.jar"
          
          db_instance_class      = "db.t4g.micro"
          db_allocated_storage   = 20
          db_engine_version      = "16.3"
          db_name                = "valida_pessoa"
          db_username            = "postgres"
          db_password            = "${{ secrets.DB_PASSWORD }}"
          db_multi_az            = false
          db_backup_retention    = 7
          db_deletion_protection = false
          db_skip_final_snapshot = true
          
          new_relic_license_key       = "${{ secrets.NEW_RELIC_LICENSE_KEY }}"
          enable_new_relic_monitoring = true
          
          alert_email_recipients = "${{ secrets.ALERT_EMAIL }}"
          
          enable_alarms = true
          log_retention_days = 14
          
          additional_tags = {
            Team       = "FIAP"
            ManagedBy  = "GitHub-Actions"
            Repository = "${{ github.repository }}"
          }
          EOF

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init

      - name: Terraform Format Check
        run: |
          cd infra/terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra/terraform
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd infra/terraform
          terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan
          retention-days: 5

  # ============================================================================
  # Job 4: Deploy to AWS
  # ============================================================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [terraform-plan, security-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: LambdaValidaPessoa/target/

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init

      - name: Terraform Apply
        id: deploy
        run: |
          cd infra/terraform
          terraform apply -auto-approve tfplan
          
          # Capturar outputs
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          echo "lambda_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT

      - name: Test API Endpoint
        run: |
          API_URL="${{ steps.deploy.outputs.api_url }}"
          echo "Testing API: $API_URL"
          
          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"cpf":"11144477735"}')
          
          echo "Response: $RESPONSE"
          
          # Verificar se recebeu um token
          if echo "$RESPONSE" | grep -q "token"; then
            echo "✅ API is working!"
          else
            echo "❌ API test failed!"
            exit 1
          fi

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🚀 Deployment Summary
          ## Environment
          - **Environment**: ${{ github.event.inputs.environment || 'dev' }}
          - **Region**: ${{ env.AWS_REGION }}
          - **Commit**: ${{ github.sha }}
          ## Resources Deployed
          - **Lambda Function**: ${{ steps.deploy.outputs.lambda_name }}
          - **API Gateway URL**: ${{ steps.deploy.outputs.api_url }}
          ## Test Result
          ✅ API endpoint is working correctly
          ## Next Steps
          - Run integration tests
          - Check New Relic dashboard for metrics
          - Monitor the application in CloudWatch
          EOF

  # ============================================================================
  # Job 5: Notify (opcional)
  # ============================================================================
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "Deploy ${{ needs.deploy.result }} for Lambda Valida Pessoa",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deploy Status*: ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }}\n*Environment*: ${{ github.event.inputs.environment || 'dev' }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }

