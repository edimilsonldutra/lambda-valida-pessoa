name: 🔄 Auto Merge Develop to Main

on:
  schedule:
    # Executa toda segunda-feira às 10h UTC (7h BRT)
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      force_merge:
        description: 'Force merge even if checks fail'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-pr:
    name: 🔄 Sync Develop to Main
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔍 Check if sync needed
        id: check
        run: |
          git fetch origin main develop
          
          BEHIND=$(git rev-list --count origin/main..origin/develop)
          
          echo "commits_behind=${BEHIND}" >> $GITHUB_OUTPUT
          
          if [ "$BEHIND" -eq 0 ]; then
            echo "✅ Main is up to date with develop"
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Main is ${BEHIND} commits behind develop"
            echo "sync_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Create Sync PR
        if: steps.check.outputs.sync_needed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'develop',
              base: 'main'
            });
            
            if (pullRequests.length > 0) {
              console.log('✅ Sync PR already exists:', pullRequests[0].html_url);
              return;
            }
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 chore: Sync develop to main',
              head: 'develop',
              base: 'main',
              body: `## 🔄 Automated Sync from Develop to Main
              
              This PR was automatically created to sync the \`develop\` branch to \`main\`.
              
              ### 📊 Changes
              - **Commits behind**: ${{ steps.check.outputs.commits_behind }}
              
              ### ✅ Pre-merge Checklist
              - [ ] All CI/CD checks passed
              - [ ] Code review completed
              - [ ] Staging environment tested
              - [ ] Documentation updated
              - [ ] Breaking changes documented (if any)
              
              ### 🚀 Deployment
              After merging, this will trigger a production deployment.
              
              ---
              <sub>🤖 Automated PR created by GitHub Actions</sub>
              `,
              draft: false
            });
            
            console.log('✅ Created sync PR:', pr.html_url);
            
            // Adiciona labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['sync', 'automated', 'release']
            });

      - name: 📢 Notify on Slack
        if: ${{ steps.check.outputs.sync_needed == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🔄 New sync PR created: develop → main",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🔄 Sync PR Created"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commits:*\n${{ steps.check.outputs.commits_behind }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Please review and approve the sync PR to proceed with production deployment."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
