name: 🔐 Validate Required Secrets

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to validate'
        required: true
        type: string
    outputs:
      validation_result:
        description: 'Result of secrets validation'
        value: ${{ jobs.validate.outputs.result }}
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate'
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  validate:
    name: 🔐 Validate Secrets for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.validate.outputs.result }}

    steps:
      - name: 🔍 Validate Required Secrets
        id: validate
        run: |
          echo "Validating secrets for environment: ${{ inputs.environment }}"
          
          MISSING_SECRETS=()
          
          # Common secrets (all environments)
          if [ -z "${{ secrets.TERRAFORM_STATE_BUCKET }}" ]; then
            MISSING_SECRETS+=("TERRAFORM_STATE_BUCKET")
          fi
          
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            MISSING_SECRETS+=("JWT_SECRET")
          fi
          
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            MISSING_SECRETS+=("DB_PASSWORD")
          fi
          
          # Environment-specific secrets
          if [ "${{ inputs.environment }}" == "development" ]; then
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID_DEV }}" ]; then
              MISSING_SECRETS+=("AWS_ACCESS_KEY_ID_DEV")
            fi
            
            if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" ]; then
              MISSING_SECRETS+=("AWS_SECRET_ACCESS_KEY_DEV")
            fi
            
            if [ -z "${{ secrets.S3_DEPLOYMENT_BUCKET_DEV }}" ]; then
              MISSING_SECRETS+=("S3_DEPLOYMENT_BUCKET_DEV")
            fi
          fi
          
          if [ "${{ inputs.environment }}" == "production" ]; then
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" ]; then
              MISSING_SECRETS+=("AWS_ACCESS_KEY_ID_PROD")
            fi
            
            if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" ]; then
              MISSING_SECRETS+=("AWS_SECRET_ACCESS_KEY_PROD")
            fi
            
            if [ -z "${{ secrets.S3_DEPLOYMENT_BUCKET_PROD }}" ]; then
              MISSING_SECRETS+=("S3_DEPLOYMENT_BUCKET_PROD")
            fi
          fi
          
          # Optional but recommended secrets
          OPTIONAL_SECRETS=()
          
          if [ -z "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            OPTIONAL_SECRETS+=("NEW_RELIC_LICENSE_KEY")
          fi
          
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            OPTIONAL_SECRETS+=("SLACK_WEBHOOK_URL")
          fi
          
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            OPTIONAL_SECRETS+=("SONAR_TOKEN")
          fi
          
          # Report results
          echo "=== Secrets Validation Report ==="
          echo ""
          
          if [ ${#MISSING_SECRETS[@]} -eq 0 ]; then
            echo "✅ All required secrets are configured"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Missing required secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "result=failure" >> $GITHUB_OUTPUT
          fi
          
          if [ ${#OPTIONAL_SECRETS[@]} -gt 0 ]; then
            echo ""
            echo "⚠️ Missing optional secrets (some features may be disabled):"
            for secret in "${OPTIONAL_SECRETS[@]}"; do
              echo "  - $secret"
            done
          fi
          
          echo ""
          echo "=== Configuration Guide ==="
          echo "To configure secrets, go to:"
          echo "Repository Settings → Secrets and variables → Actions"
          echo ""
          
          # Fail if any required secrets are missing
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            exit 1
          fi

      - name: 📝 Create Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🔐 Secrets Validation Report
          
          **Environment:** ${{ inputs.environment }}
          **Status:** ${{ steps.validate.outputs.result }}
          
          ## Required Secrets
          - TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET != '' && '✅' || '❌' }}
          - JWT_SECRET: ${{ secrets.JWT_SECRET != '' && '✅' || '❌' }}
          - DB_PASSWORD: ${{ secrets.DB_PASSWORD != '' && '✅' || '❌' }}
          
          ## Environment Secrets (${{ inputs.environment }})
          EOF
          
          if [ "${{ inputs.environment }}" == "development" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          - AWS_ACCESS_KEY_ID_DEV: ${{ secrets.AWS_ACCESS_KEY_ID_DEV != '' && '✅' || '❌' }}
          - AWS_SECRET_ACCESS_KEY_DEV: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV != '' && '✅' || '❌' }}
          - S3_DEPLOYMENT_BUCKET_DEV: ${{ secrets.S3_DEPLOYMENT_BUCKET_DEV != '' && '✅' || '❌' }}
          EOF
          fi
          
          if [ "${{ inputs.environment }}" == "production" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          - AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD != '' && '✅' || '❌' }}
          - AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD != '' && '✅' || '❌' }}
          - S3_DEPLOYMENT_BUCKET_PROD: ${{ secrets.S3_DEPLOYMENT_BUCKET_PROD != '' && '✅' || '❌' }}
          EOF
          fi
          
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          
          ## Optional Secrets
          - NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY != '' && '✅' || '⚠️' }}
          - SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' && '✅' || '⚠️' }}
          - SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' && '✅' || '⚠️' }}
          
          ---
          
          ${{ steps.validate.outputs.result == 'success' && '✅ All required secrets are configured!' || '❌ Some required secrets are missing. Please configure them before deployment.' }}
          EOF

