# GitLab CI/CD Pipeline for Lambda Valida Pessoa

stages:
  - build
  - test
  - security
  - plan
  - deploy
  - notify

variables:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.6
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Cache para acelerar builds
cache:
  paths:
    - .m2/repository
    - LambdaValidaPessoa/target

# ============================================================================
# Build Stage
# ============================================================================
build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd LambdaValidaPessoa
    - mvn clean package -B -DskipTests
  artifacts:
    paths:
      - LambdaValidaPessoa/target/*.jar
    expire_in: 1 week
  tags:
    - docker

# ============================================================================
# Test Stage
# ============================================================================
test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd LambdaValidaPessoa
    - mvn test -B
  artifacts:
    when: always
    reports:
      junit:
        - LambdaValidaPessoa/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'
  tags:
    - docker

# ============================================================================
# Security Stage
# ============================================================================
security_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL ./LambdaValidaPessoa
  allow_failure: true
  tags:
    - docker

# ============================================================================
# Terraform Plan Stage
# ============================================================================
terraform_plan:
  stage: plan
  image: hashicorp/terraform:$TERRAFORM_VERSION
  before_script:
    - cd infra/terraform
    - |
      cat > terraform.tfvars <<EOF
      aws_region  = "$AWS_REGION"
      environment = "${CI_COMMIT_BRANCH:-dev}"
      project_name = "valida-pessoa"
      
      jwt_secret        = "$JWT_SECRET"
      jwt_expiration_ms = 3600000
      
      lambda_jar_path = "../../LambdaValidaPessoa/target/ValidaPessoa-1.0.jar"
      
      db_password = "$DB_PASSWORD"
      
      new_relic_license_key = "$NEW_RELIC_LICENSE_KEY"
      enable_new_relic_monitoring = true
      
      alert_email_recipients = "$ALERT_EMAIL"
      EOF
    - terraform init
  script:
    - terraform validate
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infra/terraform/tfplan
      - infra/terraform/.terraform
    expire_in: 1 week
  tags:
    - docker
  only:
    - main
    - develop

# ============================================================================
# Deploy Stage
# ============================================================================
deploy_dev:
  stage: deploy
  image: hashicorp/terraform:$TERRAFORM_VERSION
  dependencies:
    - build
    - terraform_plan
  before_script:
    - cd infra/terraform
    - terraform init
  script:
    - terraform apply -auto-approve tfplan
    - |
      echo "API_URL=$(terraform output -raw api_gateway_url)" >> deploy.env
      echo "LAMBDA_NAME=$(terraform output -raw lambda_function_name)" >> deploy.env
  artifacts:
    reports:
      dotenv: infra/terraform/deploy.env
  environment:
    name: dev
    url: $API_URL
  tags:
    - docker
  only:
    - develop

deploy_staging:
  stage: deploy
  image: hashicorp/terraform:$TERRAFORM_VERSION
  dependencies:
    - build
    - terraform_plan
  before_script:
    - cd infra/terraform
    - terraform init
  script:
    - terraform apply -auto-approve tfplan
  environment:
    name: staging
  tags:
    - docker
  only:
    - main
  when: manual

deploy_prod:
  stage: deploy
  image: hashicorp/terraform:$TERRAFORM_VERSION
  dependencies:
    - build
    - terraform_plan
  before_script:
    - cd infra/terraform
    - terraform init
  script:
    - terraform apply -auto-approve tfplan
  environment:
    name: production
  tags:
    - docker
  only:
    - tags
  when: manual

# ============================================================================
# Notify Stage
# ============================================================================
notify_success:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST $SLACK_WEBHOOK_URL \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "✅ Deploy successful for Lambda Valida Pessoa",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deploy Status*: ✅ Success\n*Branch*: '"$CI_COMMIT_BRANCH"'\n*Commit*: '"$CI_COMMIT_SHORT_SHA"'"
                }
              }
            ]
          }'
      fi
  tags:
    - docker
  when: on_success
  only:
    - main
    - develop

notify_failure:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST $SLACK_WEBHOOK_URL \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "❌ Deploy failed for Lambda Valida Pessoa",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deploy Status*: ❌ Failed\n*Branch*: '"$CI_COMMIT_BRANCH"'\n*Commit*: '"$CI_COMMIT_SHORT_SHA"'"
                }
              }
            ]
          }'
      fi
  tags:
    - docker
  when: on_failure
  only:
    - main
    - develop

